allprojects {
    afterEvaluate { p ->
        if (p.path == ':app') {
            p.android.sourceSets.test.kotlin.srcDir(new File(rootProject.projectDir, 'audit/home-order-review-2026-10-28/tests'))
            p.tasks.withType(Test).configureEach { outputs.upToDateWhen { false } }
        }
    }
}
gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':app')
    p.tasks.withType(Test).configureEach {
        reports.junitXml.outputLocation = p.file(new File(p.rootProject.projectDir, 'audit/home-order-review-2026-10-28/android-results-after'))
        reports.html.outputLocation = p.file(new File(p.rootProject.projectDir, 'audit/home-order-review-2026-10-28/android-html-after'))
    }
}
