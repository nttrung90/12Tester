allprojects {
    afterEvaluate { p ->
        if (p.path == ':app') {
            p.android.sourceSets.test.kotlin.srcDir(new File(rootProject.projectDir, 'audit/admin-daily-task-review-2026-10-30/tests'))
            p.tasks.withType(Test).configureEach { outputs.upToDateWhen { false } }
        }
    }
}
gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':app')
    p.tasks.withType(Test).configureEach {
        reports.junitXml.outputLocation = p.file(new File(p.rootProject.projectDir, 'audit/admin-daily-task-review-2026-10-30/android-results'))
        reports.html.outputLocation = p.file(new File(p.rootProject.projectDir, 'audit/admin-daily-task-review-2026-10-30/android-html'))
    }
}
